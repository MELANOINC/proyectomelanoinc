<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MELANO INC - AI Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        
        h1 {
            font-size: 3em;
            margin-bottom: 20px;
            text-align: center;
        }
        
        p {
            font-size: 1.2em;
            margin-bottom: 30px;
            text-align: center;
            opacity: 0.9;
        }
        
        .agents {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }
        
        .agent-card {
            background: rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            transition: transform 0.3s ease, background 0.3s ease;
            cursor: pointer;
        }
        
        .agent-card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.3);
        }
        
        .agent-card h3 {
            margin-bottom: 10px;
            font-size: 1.4em;
        }
        
        .agent-card p {
            font-size: 0.9em;
            opacity: 0.8;
        }
        
        .api-link {
            display: inline-block;
            margin-top: 30px;
            padding: 15px 30px;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: background 0.3s ease;
        }
        
        .api-link:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        .status {
            margin-top: 20px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            text-align: center;
        }
    </style>
    <!-- Vercel Web Analytics -->
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
    <div class="container">
        <h1>💠 MELANO INC</h1>
        <p>Plataforma SaaS de Automatización Inteligente con Agentes IA Interconectados</p>
        
        <div class="agents">
            <div class="agent-card" onclick="window.location.href='/hermes'">
                <h3>🔷 Hermes</h3>
                <p>Leads y Ventas</p>
            </div>
            <div class="agent-card" onclick="window.location.href='/ares'">
                <h3>⚔️ Ares</h3>
                <p>Bots de Inversión</p>
            </div>
            <div class="agent-card" onclick="window.location.href='/chronos'">
                <h3>⏰ Chronos</h3>
                <p>Automatización de Flujo</p>
            </div>
            <div class="agent-card" onclick="window.location.href='/athena'">
                <h3>🦉 Athena</h3>
                <p>Analítica y Rendimiento</p>
            </div>
        </div>
        
        <div class="status" id="status">
            <p>Cargando estado del sistema...</p>
        </div>
        
        <div style="text-align: center;">
            <a href="/docs" class="api-link">📚 API Documentation</a>
            <a href="/status" class="api-link">🛰️ System Status</a>
        </div>
    </div>
    
    <script>
        // Fetch system status
        fetch('/status')
            .then(response => response.json())
            .then(data => {
                const statusDiv = document.getElementById('status');
                const agents = Object.entries(data);
                const allOnline = agents.every(([_, status]) => status === 'online');
                
                statusDiv.innerHTML = `
                    <p style="font-size: 1.1em; margin-bottom: 10px;">
                        ${allOnline ? '✅ Todos los agentes están en línea' : '⚠️ Algunos agentes están fuera de línea'}
                    </p>
                    <p style="font-size: 0.9em; opacity: 0.8;">
                        ${agents.map(([name, status]) => `${name}: ${status}`).join(' | ')}
                    </p>
                `;
            })
            .catch(error => {
                document.getElementById('status').innerHTML = '<p>❌ Error al cargar el estado del sistema</p>';
                console.error('Error:', error);
            });
    </script>
</body>
</html>
